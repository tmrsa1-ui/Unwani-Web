name: Deploy GitHub Pages
# التطبيق الحي يُنشر من tmrsa1-ui.github.io/unwani/. هذا النشر يدوي فقط،
# ويحتاج تفعيل Settings → Pages → Source = GitHub Actions مرة واحدة قبل تشغيله.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
